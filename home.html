<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faria Notícias</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/menu.hamburguer.js"></script>
    <script src="https://kit.fontawesome.com/b995ce2abd.js" crossorigin="anonymous"></script>
    <script src="./assets/js/home.js" type="module"></script>
</head>

<body>

    <header>
        <div class="logo">P</div>
        <h1 class="titulo">Meu site de notícias</h1>
        <div class="menu-hamburguer" onclick="alternarVisualizacaoDoMenuLateral()">
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>

    <section>
        <nav>
            <ul class="menu-lateral">
                <li id="opcao-noticia">
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-newspaper"></i>
                            </div>
                            <div class="rotulo"></div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div class="rotulo"></div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="index.html">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="rotulo"></div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            </div>
                            <div class="rotulo"></div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </a>
                </li>

        </nav>

        <main id="noticias" class="container">
            
        </main>
    </section>

    <footer>&copy; FARIANEWS </footer>
</body>

</html>
