<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site de notícias</title>
    <link rel="stylesheet" href="./assets/css/login/estilo.css"/>
    <script src="./assets/js/login.js" type="module"></script>
</head>
<body>
    <header>
        <div class="logo">P</div>
        <h1 class="titulo">FARIA NEWS</h1>
    </header>
    <div class="container">
        <h1>Login</h1>
        <form>
            <div class="input-grupo">
                <i class="fas fa-lock"></i>
                <input id="email" type="email" placeholder="Informe seu e-mail">
            </div>
            <button><i class="fas fa-sign-in-alt"></i>Entrar</button>
        </form>
        <div class="links-auxiliares">
            <a href="#">Esqueceu a senha?</a>
            <span>-</span>
            <a href="#">Registre-se</a>
        </div>
        <form action="">
            <input type="senha" type="password" placeholder="Informe sua senha">
            <button on click="verificarCredencias(); return false;">
                <i class="fas fa-sign-in-alt"></i></button>
        </form>
    </div>
</body>
</html>
